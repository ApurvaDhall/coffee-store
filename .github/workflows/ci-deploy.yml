# Save as .github/workflows/ci-deploy.yml
# Runs lint + tests on every PR and push. Deploys only on push to main, and only if checks pass.

name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.folder }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Type check (backend)
        if: matrix.folder == 'backend'
        run: npx tsc --noEmit
      - name: Tests
        run: npm test --if-present
      - name: Build (frontend)
        if: matrix.folder == 'frontend'
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy backend (migrations, then Worker)
        working-directory: backend
        run: |
          npm ci
          npx wrangler d1 migrations apply DB --remote
          npx wrangler deploy

      - name: Deploy frontend (Cloudflare Pages)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx wrangler pages deploy dist --project-name=coffee-frontend --branch=main
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
